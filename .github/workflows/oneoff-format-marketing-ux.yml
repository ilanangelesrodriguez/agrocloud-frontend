name: One-off marketing formatting
on:
  push:
    branches:
      - feat/marketing-layout-footer-navigation
    paths:
      - .github/workflows/oneoff-format-marketing-ux.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - name: Format reviewed marketing components
        run: |
          npx prettier --write \
            apps/portal/components/marketing/faq.tsx \
            apps/portal/components/marketing/marketing/contact-content.tsx \
            apps/portal/components/marketing/site-footer.tsx \
            apps/portal/features/marketing/home/components/home-content.tsx
      - name: Commit formatting on review branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/portal/components/marketing/faq.tsx \
            apps/portal/components/marketing/marketing/contact-content.tsx \
            apps/portal/components/marketing/site-footer.tsx \
            apps/portal/features/marketing/home/components/home-content.tsx
          if ! git diff --cached --quiet; then
            git commit -m "style(marketing): apply Prettier to public pages"
            git push origin HEAD:feat/marketing-layout-footer-navigation
          fi
