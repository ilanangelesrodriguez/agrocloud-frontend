name: One-off format marketing polish
on:
  push:
    branches:
      - feat/marketing-polish-pricing-motion
    paths:
      - .github/workflows/oneoff-format-marketing-polish.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - name: Format updated landing files
        run: |
          npx prettier --write \
            apps/portal/features/marketing/plans/components/plan-card.tsx \
            apps/portal/features/marketing/plans/components/plans-content.tsx \
            apps/portal/features/marketing/plans/components/plans-state.tsx \
            apps/portal/components/marketing/faq.tsx \
            apps/portal/components/marketing/reveal.tsx \
            apps/portal/components/marketing/marketing/feature-card.tsx \
            apps/portal/components/marketing/marketing/call-to-action.tsx \
            apps/portal/features/marketing/home/components/home-content.tsx \
            apps/portal/styles/marketing.css
      - name: Commit formatting on review branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/portal/features/marketing/plans/components \
            apps/portal/components/marketing/faq.tsx \
            apps/portal/components/marketing/reveal.tsx \
            apps/portal/components/marketing/marketing/feature-card.tsx \
            apps/portal/components/marketing/marketing/call-to-action.tsx \
            apps/portal/features/marketing/home/components/home-content.tsx \
            apps/portal/styles/marketing.css
          if ! git diff --cached --quiet; then
            git commit -m "style(marketing): format pricing and landing changes"
            git push origin HEAD:feat/marketing-polish-pricing-motion
          fi
