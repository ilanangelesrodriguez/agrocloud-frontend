name: One-off format evidence drop zone
on:
  push:
    branches:
      - feat/evidence-upload-drop-zone
    paths:
      - .github/workflows/oneoff-format-evidence-dropzone.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - name: Format evidence uploader changes
        run: |
          npx prettier --write \
            apps/portal/features/evidences/components/evidence-drop-zone.tsx \
            apps/portal/features/evidences/components/inspection-evidence.tsx
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/portal/features/evidences/components/evidence-drop-zone.tsx \
            apps/portal/features/evidences/components/inspection-evidence.tsx
          if ! git diff --cached --quiet; then
            git commit -m "style(evidences): format drop zone"
            git push origin HEAD:feat/evidence-upload-drop-zone
          fi
