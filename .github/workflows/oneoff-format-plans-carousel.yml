name: One-off format pricing carousel
on:
  push:
    branches:
      - feat/pricing-two-card-carousel
    paths:
      - .github/workflows/oneoff-format-plans-carousel.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - name: Format carousel and pricing page
        run: |
          npx prettier --write \
            apps/portal/features/marketing/plans/components/plans-carousel.tsx \
            apps/portal/features/marketing/plans/components/plans-content.tsx
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/portal/features/marketing/plans/components/plans-carousel.tsx \
            apps/portal/features/marketing/plans/components/plans-content.tsx
          if ! git diff --cached --quiet; then
            git commit -m "style(marketing): format pricing carousel"
            git push origin HEAD:feat/pricing-two-card-carousel
          fi
