name: One-off ambient UX formatting
on:
  push:
    branches:
      - feat/marketing-ambient-autoplay
    paths:
      - .github/workflows/oneoff-format-ambient-ux.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - name: Format changed marketing files
        run: |
          npx prettier --write \
            apps/portal/components/marketing/marketing/marketing-backdrop.tsx \
            apps/portal/components/marketing/use-marketing-auto-step.ts \
            apps/portal/features/marketing/home/components/home-content.tsx \
            apps/portal/components/marketing/marketing/workflow-content.tsx \
            apps/portal/components/marketing/marketing/page-hero.tsx \
            apps/portal/components/marketing/marketing/call-to-action.tsx \
            apps/portal/styles/marketing.css
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/portal/components/marketing \
            apps/portal/features/marketing/home/components/home-content.tsx \
            apps/portal/styles/marketing.css
          if ! git diff --cached --quiet; then
            git commit -m "style(marketing): format ambient UX update"
            git push origin HEAD:feat/marketing-ambient-autoplay
          fi
